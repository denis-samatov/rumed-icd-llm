[project]
name = "rumed-icd-llm"
version = "0.1.0"
description = "LoRA vs prompting vs RAG for ICD-10 coding of Russian clinical complaints (RuMedTop3)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rumed_icd"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
