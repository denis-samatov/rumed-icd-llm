name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Install maintained CPU verification profile
        run: |
          uv venv
          uv pip sync --require-hashes requirements-execution.txt
          uv pip install --no-deps --no-build-isolation .
          uv pip check
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m pytest -q
      - name: Replay saved predictions without models
        run: |
          .venv/bin/python scripts/verify_qwen3_results.py
          .venv/bin/python scripts/verify_kev_results.py
